name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # El sitio queda en https://<cuenta>.github.io/<repositorio>/
  # y la versión completa del material, en .../<repositorio>/completa/
  SITE_URL: https://${{ github.repository_owner }}.github.io
  BASE_PATH: /${{ github.event.repository.name }}
  PUBLIC_REPO_URL: https://github.com/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Versión del taller (rama main)
        run: |
          npm ci
          npm run build

      - name: Versión completa (rama version-completa)
        run: |
          git worktree add ../completa origin/version-completa
          cd ../completa
          npm ci
          BASE_PATH="$BASE_PATH/completa" npm run build
          cp -r dist "$GITHUB_WORKSPACE/dist/completa"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
